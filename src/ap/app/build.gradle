apply plugin: 'com.android.application'

android {
    namespace 'com.hermes.dashcast'
    compileSdk 35

    defaultConfig {
        applicationId "com.hermes.dashcast"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        // JSch 可能带重复的 META-INF 资源
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
    }
}

dependencies {
    implementation 'com.jcraft:jsch:0.1.55'
}
