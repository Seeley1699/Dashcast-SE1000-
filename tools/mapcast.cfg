# mapcast.cfg —— 仪表盘配置
#
# 推到车机：
#   adb push mapcast.cfg /data/local/tmp/
#
# 改完 5 秒内自动生效（menu 里有热重载）。
# 格式：key = value，# 开头是注释。
#
# 坐标系：1920×532，左上角 (0,0)

# ═══════════════════════════════════════════════════
# 主题配色（#RRGGBB 或 #AARRGGBB）
# ═══════════════════════════════════════════════════

# 主强调色（圆盘弧、NOA、档位高亮）
theme.accent = #FF43E8C8

# 卡片底（65% 黑，能透出地图）
theme.panel = #A7000000

# 卡片描边（14% 白）
theme.panelEdge = #24FFFFFF

# 正文 / 次要文字
theme.text = #FFE6F1F1
theme.textDim = #FF75898E

# 状态色
theme.evGreen = #FF5CE38A
theme.fuelBlue = #FF4FC3FF
theme.warn = #FFFFC93C
theme.red = #FFFF5252

# ═══════════════════════════════════════════════════
# 布局（改这些就能挪卡片、改大小）
# ═══════════════════════════════════════════════════

# 速度卡（含圆盘）
gauge.x = 16
gauge.y = 16
gauge.w = 512
gauge.h = 314

# 电量续航卡
ev.x = 16
ev.y = 342
ev.w = 512
ev.h = 84

# 燃油续航卡
fuel.x = 16
fuel.y = 438
fuel.w = 512
fuel.h = 84

# 时钟
clock.x = 1424
clock.y = 16
clock.w = 480
clock.h = 92

# 媒体卡
media.x = 1424
media.y = 120
media.w = 480
media.h = 326

# 档位
gear.x = 1424
gear.y = 458
gear.w = 480
gear.h = 64

# 中列（地图区不绘制，只画边框；其余是占位卡）
rail.x = 544
rail.y = 16
rail.w = 864
rail.h = 40

map.x = 544
map.y = 64
map.w = 864
map.h = 382

nav.x = 544
nav.y = 458
nav.w = 864
nav.h = 64

# ═══════════════════════════════════════════════════
# 速度圆盘（相对 gauge 卡内坐标）
# ═══════════════════════════════════════════════════

speedo.cx = 256
speedo.cy = 134
speedo.r = 118
speedo.max = 220
speedo.over = 120

# ═══════════════════════════════════════════════════
# 性能
# ═══════════════════════════════════════════════════

# 活动帧率 / 静止帧率
ui.fps = 30
ui.fpsIdle = 15

# ═══════════════════════════════════════════════════
# 协议版本（改这个要小心）
# ═══════════════════════════════════════════════════
# 1 = VDF1（16 字节头，dcapd2 现在只认这个）
# 2 = VDF2（32 字节头 + CRC32 + seq + dropped）
# 默认 1，等 dcapd2 支持 VDF2 再改
# proto.ver = 2
